name: terraform-docs

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz \
            https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: Generate docs
        run: |
          mkdir -p docs/modules
          for dir in modules/*/; do
            name=$(basename "$dir")
            terraform-docs markdown table --output-file "$(pwd)/docs/modules/${name}.md" "$dir"
          done

      - name: Commit if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/modules/
          git diff --cached --quiet || git commit -m "docs: regenerate module docs"
          git push
